name: Development Build

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

permissions:
  contents: read
  checks: write
  pull-requests: write
  id-token: write

concurrency:
  group: development-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gradle-build:
    name: Gradle Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew clean build --continue --no-daemon

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: ${{ !cancelled() }}
        with:
          check_name: Gradle Test Results
          files: "**/build/test-results/**/TEST-*.xml"
          comment_mode: off

      - name: Add coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import os

          reports = sorted(Path(".").glob("**/build/reports/jacoco/test/jacocoTestReport.xml"))

          lines = [
              "## Code Coverage",
              "",
              "| Scope | Covered Lines | Missed Lines | Line Coverage |",
              "| --- | ---: | ---: | ---: |",
          ]

          total_covered = 0
          total_missed = 0

          for report in reports:
              root = ET.parse(report).getroot()
              counter = next(
                  (item for item in root.findall("counter") if item.attrib.get("type") == "LINE"),
                  None
              )

              if counter is None:
                  continue

              covered = int(counter.attrib["covered"])
              missed = int(counter.attrib["missed"])
              total = covered + missed
              percent = 100 * covered / total if total else 100.0

              module = "/".join(report.parts[:2]) if report.parts[0] in {"apps", "modules"} else report.parts[0]

              lines.append(f"| `{module}` | {covered} | {missed} | {percent:.2f}% |")

              total_covered += covered
              total_missed += missed

          total = total_covered + total_missed
          total_percent = 100 * total_covered / total if total else 100.0

          lines.append(
              f"| **Total** | **{total_covered}** | **{total_missed}** | **{total_percent:.2f}%** |"
          )

          Path("coverage-summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")

          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          PY

      - name: Generate Allure report
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p build/allure-results

          if [ -d apps ] || [ -d modules ]; then
            find apps modules -path "*/build/allure-results/*" -type f -print -exec cp {} build/allure-results/ \; || true
          fi

          if [ -z "$(find build/allure-results -type f -print -quit)" ]; then
            echo "No Allure result files found."
            mkdir -p build/reports/allure-report
            cat > build/reports/allure-report/index.html <<'HTML'
          <!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Allure Report</title>
          </head>
          <body>
            <h1>Allure Report</h1>
            <p>No Allure result files were found in this workflow run.</p>
          </body>
          </html>
          HTML
          else
            npx --yes allure-commandline@2.34.1 generate build/allure-results --clean -o build/reports/allure-report
          fi

      - name: Add Allure report summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Allure Report"
            echo ""
            echo "Allure report was generated and uploaded as workflow artifact."
            echo ""
            echo "Open this workflow run and download artifact named **allure-report**."
            echo ""
            echo "[Open workflow run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        if: ${{ !cancelled() }}
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: >
            ./apps/service/build/reports/jacoco/test/jacocoTestReport.xml,
            ./modules/api/build/reports/jacoco/test/jacocoTestReport.xml,
            ./modules/cqrs/build/reports/jacoco/test/jacocoTestReport.xml,
            ./modules/downloader/build/reports/jacoco/test/jacocoTestReport.xml
          flags: unit-tests
          name: md-page-harvester-development
          verbose: true

      - name: Note Codecov behavior
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Codecov Upload"
            echo ""
            echo "Codecov upload is non-blocking. JaCoCo XML and HTML coverage reports are always uploaded as workflow artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: error

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage-reports
          path: |
            coverage-summary.md
            **/build/reports/jacoco/test/**
          if-no-files-found: error

      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: build/reports/allure-report/**
          if-no-files-found: error
          retention-days: 14
