micronaut:
  application:
    name: md-page-harvester
  server:
    port: ${HTTP_PORT:8080}

endpoints:
  health:
    enabled: true
    sensitive: false

md-page-harvester:
  source-project:
    uri: ${SOURCE_PROJECT_URI:}
    branch: ${SOURCE_PROJECT_BRANCH:main}
  storage:
    pages-directory: ${PAGES_DIRECTORY:/data/pages}

